<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>404</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  /* Кнопка-обманка в правом верхнем углу */
  #fakeMute {
    position: fixed;
    top: 14px;
    right: 14px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    cursor: pointer;
  }
  #fakeMute svg { width: 26px; height: 26px; fill: #fff; }
  /* Модальное окно */
  #modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(3px);
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 24px;
  }
  #modal.show { display: flex; }
  .box {
    background: #fff;
    border-radius: 16px;
    width: 100%;
    max-width: 340px;
    padding: 28px 22px 20px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: pop .25s ease;
  }
  @keyframes pop {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .box h1 {
    font-size: 30px;
    color: #e74c3c;
    margin-bottom: 12px;
    letter-spacing: 1px;
  }
  .box p {
    font-size: 15px;
    color: #555;
    line-height: 1.5;
    margin-bottom: 24px;
  }
  .box button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #111;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .box button:active { background: #333; }
</style>
</head>
<body>

  <!-- Кнопка выключения музыки (не работает) -->
  <div id="fakeMute" aria-label="mute">
    <svg viewBox="0 0 24 24">
      <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
    </svg>
  </div>

  <!-- Окно с ошибкой 404 -->
  <div id="modal">
    <div class="box">
      <h1>404</h1>
      <p>Ошибка: страница не найдена.<br>Попробуйте позже.</p>
      <button id="okBtn">ОКЕЙ</button>
    </div>
  </div>

  <!-- Аудио -->
  <audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>

<script>
  (function () {
    var audio = document.getElementById('bgMusic');
    var modal = document.getElementById('modal');

    // Показываем окно 404 сразу
    modal.classList.add('show');

    // Функция запуска музыки
    function playMusic() {
      var p = audio.play();
      if (p && p.catch) p.catch(function () {});
    }

    // 1) Пытаемся запустить сразу (сработает, если браузер разрешит)
    playMusic();

    // 2) При первом люом касании/клике — гарантированный запуск
    function unlock() {
      playMusic();
      document.removeEventListener('touchstart', unlock);
      document.removeEventListener('click', unlock);
    }
    document.addEventListener('touchstart', unlock, { once: true });
    document.addEventListener('click', unlock, { once: true });

    // Кнопка ОКЕЙ закрывает окно
    document.getElementById('okBtn').addEventListener('click', function (e) {
      e.stopPropagation();
      modal.classList.remove('show');
      playMusic();
    });

    // Кнопка-обманка: НИЧЕГО не делает
    document.getElementById('fakeMute').addEventListener('click', function (e) {
      e.stopPropagation();
      // намеренно пусто — музыка не выключается
    });
  })();
</script>
</body>
</html>
