<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Космос и звезда</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="space"></canvas>

<script>
(function() {
  const canvas = document.getElementById('space');
  const ctx = canvas.getContext('2d');
  let W = window.innerWidth;
  let H = window.innerHeight;
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // ---------- Звёзды фона ----------
  const stars = [];
  const STAR_COUNT = Math.floor((W * H) / 2500);
  for (let i = 0; i < STAR_COUNT; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.4 + 0.3,
      a: Math.random() * 0.8 + 0.2,
      tw: Math.random() * Math.PI * 2,
      ts: Math.random() * 0.02 + 0.005
    });
  }

  // ---------- Туманность на фоне ----------
  const nebulae = [
    { x: W * 0.2, y: H * 0.3, r: Math.max(W, H) * 0.4, c: 'rgba(60,20,120,0.12)' },
    { x: W * 0.8, y: H * 0.7, r: Math.max(W, H) * 0.45, c: 'rgba(20,80,140,0.10)' },
    { x: W * 0.5, y: H * 0.5, r: Math.max(W, H) * 0.5, c: 'rgba(120,20,80,0.08)' }
  ];

  // ---------- Звезда ----------
  const cx = () => W / 2;
  const cy = () => H / 2;
  const star = {
    r: Math.min(W, H) * 0.06,
    life: 0,        // время жизни
    exploded: false,
    explodeTime: 0
  };
  // время до взрыва (сек)
  const PRE_EXPLODE = 2.2;
  // длительность анимации взрыва
  const EXPLODE_DUR = 3.5;

  // частицы взрыва
  let particles = [];
  let shockwaves = [];

  function spawnExplosion() {
    star.exploded = true;
    star.explodeTime = 0;
    const num = 220;
    const speedBase = Math.min(W, H) * 0.45;
    for (let i = 0; i < num; i++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = speedBase * (0.2 + Math.random() * 0.9);
      particles.push({
        x: cx(),
        y: cy(),
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        r: Math.random() * 2.5 + 0.8,
        life: 1,
        decay: 0.25 + Math.random() * 0.5,
        hue: 30 + Math.random() * 40,
        trail: []
      });
    }
    // ударные волны
    shockwaves.push({ r: 0, max: Math.min(W, H) * 0.9, life: 1 });
    shockwaves.push({ r: 0, max: Math.min(W, H) * 0.6, life: 1 });
  }

  // ---------- Звук пердежа (Web Audio) ----------
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playFart() {
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    // Основной "пукающий" тон — пила с модуляцией частоты вниз
    const osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    const baseFreq = 90 + Math.random() * 40;
    osc.frequency.setValueAtTime(baseFreq, now);
    osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.45, now + 0.35);

    // фильтр, чтобы звук был "мягким"
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1200, now);
    filter.frequency.exponentialRampToValueAtTime(300, now + 0.4);
    filter.Q.value = 6;

    // лёгкая вибрация частоты (дрожание)
    const lfo = audioCtx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 28 + Math.random() * 12;
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 25;
    lfo.connect(lfoGain);
    lfoGain.connect(osc.frequency);

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.35, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);

    // шумовой слой (пузыри)
    const bufferSize = audioCtx.sampleRate * 0.4;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.value = 400 + Math.random() * 300;
    noiseFilter.Q.value = 1.2;
    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.12, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.38);

    osc.connect(filter);
    filter.connect(gain);
    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(gain);
    gain.connect(audioCtx.destination);

    lfo.start(now);
    osc.start(now);
    noise.start(now);

    const stopAt = now + 0.48;
    osc.stop(stopAt);
    lfo.stop(stopAt);
    noise.stop(stopAt);
  }

  // ---------- Обработка нажатий ----------
  function onTap(e) {
    e.preventDefault();
    playFart();
  }
  canvas.addEventListener('pointerdown', onTap);
  // на всякий случай для старых браузеров
  canvas.addEventListener('touchstart', onTap, { passive: false });

  // ---------- Анимация ----------
  let last = performance.now() / 1000;
  let elapsed = 0;

  function draw(t) {
    const dt = Math.min(t - last, 0.05);
    last = t;
    elapsed += dt;

    // фон
    ctx.fillStyle = '#04010a';
    ctx.fillRect(0, 0, W, H);

    // туманности
    for (const n of nebulae) {
      const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
      g.addColorStop(0, n.c);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // мерцающие звёзды
    for (const s of stars) {
      s.tw += s.ts;
      const alpha = s.a * (0.55 + 0.45 * Math.sin(s.tw));
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // ---------- Звезда до взрыва ----------
    if (!star.exploded) {
      star.life += dt;
      // пульсация
      const pulse = 1 + 0.12 * Math.sin(star.life * 6);
      const rr = star.r * pulse;

      // свечение
      const glow = ctx.createRadialGradient(cx(), cy(), 0, cx(), cy(), rr * 5);
      glow.addColorStop(0, 'rgba(255,240,180,0.9)');
      glow.addColorStop(0.25, 'rgba(255,180,80,0.55)');
      glow.addColorStop(0.6, 'rgba(255,90,40,0.15)');
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(cx(), cy(), rr * 5, 0, Math.PI * 2);
      ctx.fill();

      // ядро
      const core = ctx.createRadialGradient(cx(), cy(), 0, cx(), cy(), rr);
      core.addColorStop(0, '#ffffff');
      core.addColorStop(0.5, '#fff3b0');
      core.addColorStop(1, '#ffb347');
      ctx.fillStyle = core;
      ctx.beginPath();
      ctx.arc(cx(), cy(), rr, 0, Math.PI * 2);
      ctx.fill();

      // лучи
      ctx.save();
      ctx.translate(cx(), cy());
      ctx.rotate(star.life * 0.3);
      for (let i = 0; i < 8; i++) {
        ctx.rotate(Math.PI / 4);
        const lg = ctx.createLinearGradient(0, 0, rr * 4, 0);
        lg.addColorStop(0, 'rgba(255,230,150,0.7)');
        lg.addColorStop(1, 'rgba(255,150,50,0)');
        ctx.fillStyle = lg;
        ctx.beginPath();
        ctx.moveTo(rr * 0.4, -2);
        ctx.lineTo(rr * 4, 0);
        ctx.lineTo(rr * 0.4, 2);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      if (star.life >= PRE_EXPLODE) {
        spawnExplosion();
      }
    } else {
      // ---------- После взрыва ----------
      star.explodeTime += dt;

      // ударные волны
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.r += (sw.max - sw.r) * 0.06 + 4;
        sw.life -= dt * 0.8;
        if (sw.life <= 0) { shockwaves.splice(i, 1); continue; }
        ctx.beginPath();
        ctx.strokeStyle = `rgba(255,200,120,${sw.life * 0.5})`;
        ctx.lineWidth = 3 * sw.life + 0.5;
        ctx.arc(cx(), cy(), sw.r, 0, Math.PI * 2);
        ctx.stroke();
      }

      // частицы
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.985;
        p.vy *= 0.985;
        p.life -= p.decay * dt;
        if (p.life <= 0) { particles.splice(i, 1); continue; }

        // хвост
        p.trail.push({ x: p.x, y: p.y });
        if (p.trail.length > 5) p.trail.shift();

        ctx.beginPath();
        ctx.fillStyle = `hsla(${p.hue}, 100%, ${55 + p.life * 25}%, ${p.life})`;
        ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
        ctx.fill();

        // маленький шлейф
        for (let j = 0; j < p.trail.length; j++) {
          const tp = p.trail[j];
          const a = (j / p.trail.length) * p.life * 0.4;
          ctx.beginPath();
          ctx.fillStyle = `hsla(${p.hue}, 100%, 70%, ${a})`;
          ctx.arc(tp.x, tp.y, p.r * 0.6, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // центральная вспышка гаснет
      if (star.explodeTime < EXPLODE_DUR) {
        const k = Math.max(0, 1 - star.explodeTime / EXPLODE_DUR);
        const flashR = Math.min(W, H) * 0.5 * (0.3 + star.explodeTime * 0.6);
        const flash = ctx.createRadialGradient(cx(), cy(), 0, cx(), cy(), flashR);
        flash.addColorStop(0, `rgba(255,255,255,${k * 0.9})`);
        flash.addColorStop(0.3, `rgba(255,200,120,${k * 0.6})`);
        flash.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = flash;
        ctx.beginPath();
        ctx.arc(cx(), cy(), flashR, 0, Math.PI * 2);
        ctx.fill();
      }

      // когда всё утихло — запускаем заново
      if (star.explodeTime > EXPLODE_DUR + 1.5 && particles.length === 0) {
        star.exploded = false;
        star.life = 0;
        particles = [];
        shockwaves = [];
      }
    }

    requestAnimationFrame(draw);
  }

  requestAnimationFrame((t) => {
    last = t / 1000;
    requestAnimationFrame(draw);
  });

})();
</script>
</body>
</html>
