<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>404</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #050505;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  /* --- ЭФФЕКТ МАТРИЦЫ НА ФОНЕ --- */
  canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1; /* Отправляем на задний план */
    opacity: 0.6; /* Делаем чуть приглушенным */
  }

  /* Кнопка-обманка в правом верхнем углу (не работает) */
  #fakeMute {
    position: fixed;
    top: 14px;
    right: 14px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    cursor: pointer;
    backdrop-filter: blur(5px);
  }
  #fakeMute svg { width: 26px; height: 26px; fill: #fff; }

  /* Модальное окно 404 */
  #modal {
    display: flex;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(5px);
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 24px;
  }
  .box {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 16px;
    width: 100%;
    max-width: 340px;
    padding: 28px 22px 20px;
    text-align: center;
    box-shadow: 0 0 40px rgba(231, 76, 60, 0.2), 0 20px 60px rgba(0,0,0,0.8);
    animation: pop .3s ease;
  }
  @keyframes pop {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .box h1 {
    font-size: 38px;
    color: #e74c3c;
    margin-bottom: 12px;
    letter-spacing: 2px;
    text-shadow: 0 0 15px rgba(231, 76, 60, 0.6);
  }
  .box p {
    font-size: 15px;
    color: #aaa;
    line-height: 1.5;
    margin-bottom: 24px;
  }
  .box button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #e74c3c;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
  }
  .box button:active { 
    background: #c0392b; 
    transform: scale(0.96);
  }
</style>
</head>
<body>

  <!-- Фоновая анимация -->
  <canvas id="matrixCanvas"></canvas>

  <!-- Кнопка выключения музыки (не работает) -->
  <div id="fakeMute" aria-label="mute">
    <svg viewBox="0 0 24 24">
      <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
    </svg>
  </div>

  <!-- Окно с ошибкой 404 -->
  <div id="modal">
    <div class="box">
      <h1>404</h1>
      <p>Критическая ошибка.<br>Страница не найдена.</p>
      <button id="okBtn">ПОНЯТНО</button>
    </div>
  </div>

  <!-- АУДИО: Прямая ссылка (raw) на ваш файл -->
  <audio id="bgMusic" src="https://raw.githubusercontent.com/Xrangel074/evil-portal-html/main/bendi.mp3" loop preload="auto"></audio>

<script>
  // --- СКРИПТ МАТРИЦЫ ---
  const canvas = document.getElementById('matrixCanvas');
  const ctx = canvas.getContext('2d');

  // Устанавливаем размер холста под размер экрана
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  // Символы для дождя (можно заменить на японские катаканы для аутентичности)
  const letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%^&*";
  const fontSize = 16;
  const columns = canvas.width / fontSize;
  const drops = [];

  // Инициализация капель
  for (let x = 0; x < columns; x++) {
    drops[x] = 1;
  }

  // Функция отрисовки кадра
  function drawMatrix() {
    // Полупрозрачный черный фон для эффекта затухания
    ctx.fillStyle = "rgba(5, 5, 5, 0.05)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Красный цвет текста (под стать ошибке)
    ctx.fillStyle = "#e74c3c";
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
      // Выбираем случайный символ
      const text = letters[Math.floor(Math.random() * letters.length)];
      // Рисуем его
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);

      // Если капля достигла низа или случайно, возвращаем её наверх
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
  }

  // Запускаем анимацию каждые 33 мс (~30 FPS)
  setInterval(drawMatrix, 33);

  // Обновляем размер холста при повороте экрана
  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });

  // --- СКРИПТ МУЗЫКИ ---
  (function () {
    var audio = document.getElementById('bgMusic');
    var modal = document.getElementById('modal');

    // Пытаемся включить сразу (сработает не везде)
    audio.play().catch(() => console.log("Ждем клика..."));

    // По клику на кнопку
    document.getElementById('okBtn').addEventListener('click', function (e) {
      e.stopPropagation();
      modal.style.display = 'none';
      
      // Включаем музыку
      audio.play().catch(function(err) {
        alert("Ошибка: Нажмите еще раз, чтобы включить звук.");
      });
    });

    // Кнопка-обманка (по-прежнему ничего не делает)
    document.getElementById('fakeMute').addEventListener('click', function (e) {
      e.stopPropagation();
    });
  })();
</script>
</body>
</html>
